name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uvx runs the pinned Ruff without installing project deps (fast, no torch).
      - name: Ruff lint
        run: uvx ruff@0.16.7 check --output-format=github .

      - name: Ruff format check
        if: ${{ !cancelled() }}  # still report formatting even if lint failed
        run: uvx ruff@0.16.7 format --check .
